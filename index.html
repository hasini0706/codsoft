<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: lavender; /* Light lavender background */
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 3em;
            color: #4b0082; /* Indigo text for contrast */
            text-shadow: 2px 2px 5px #aaa;
            margin-bottom: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-gap: 10px;
            background-color: white; /* White board background */
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .cell {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: #fff;
            color: #333;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        .cell:hover {
            transform: scale(1.05);
            background: #e6e6fa; /* Slight lavender hover */
        }

        #status {
            margin-top: 20px;
            font-size: 1.5em;
            color: #4b0082;
            font-weight: bold;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            background: #4b0082;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #9370db; /* Light purple hover */
        }
    </style>
</head>
<body>
    <h1>TIC TAC TOE</h1>
    <div class="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <div id="status"></div>
    <button onclick="restartGame()">Restart</button>

    <script src="script.js"></script>
</body>
</html>
